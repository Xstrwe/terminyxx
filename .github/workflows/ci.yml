name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon. Intel macOS and Windows arm64 are compiled
        # (not tested) by the release workflow and by the cross-arch vet below.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x' # Wails v2.13 binding generator breaks on Go 1.27
          cache-dependency-path: go.sum

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Typecheck + bundle. main.go embeds frontend/dist, so Go needs it too.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go vet
        run: go vet ./...

      # Type-check the other CPU architecture of the same OS. Windows code is
      # cgo-free, so this works there; macOS amd64 is cross-built in vet too.
      - name: Go vet (other arch)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then GOARCH=arm64 go vet ./...; else GOARCH=amd64 CGO_ENABLED=1 go vet ./...; fi

      - name: Go test
        run: go test ./...
